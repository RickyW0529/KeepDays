[package]
name = "keepdays-server"
version = "0.1.0"
edition = "2021"
workspace = "../agent-kernel"
description = "KeepDays - Multi-tenant Intimate & Couple Digital Home Backend (with agent-kernel)"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Auth & Cryptography
argon2 = "0.5"
jsonwebtoken = "9.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Serialization & Time (Beijing UTC+8)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Async Streams & HTTP Client (S3 Delete / Webhook Push)
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Observability & Config
dotenvy = "0.15"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

# Real Upstream `agent-kernel` Core Crates (Pruned & Modified from xai-org/grok-build)
xai-grok-sampler = { path = "../agent-kernel/crates/codegen/xai-grok-sampler" }
xai-grok-sampling-types = { path = "../agent-kernel/crates/codegen/xai-grok-sampling-types" }
xai-grok-compaction = { path = "../agent-kernel/crates/common/xai-grok-compaction" }
xai-grok-tools = { path = "../agent-kernel/crates/codegen/xai-grok-tools" }
xai-tool-runtime = { path = "../agent-kernel/crates/common/xai-tool-runtime" }
xai-tool-types = { path = "../agent-kernel/crates/common/xai-tool-types" }
xai-tool-protocol = { path = "../agent-kernel/crates/common/xai-tool-protocol" }
xai-grok-agent = { path = "../agent-kernel/crates/codegen/xai-grok-agent" }
xai-grok-mcp = { path = "../agent-kernel/crates/codegen/xai-grok-mcp" }
xai-grok-memory = { path = "../agent-kernel/crates/codegen/xai-grok-memory" }
xai-grok-sandbox = { path = "../agent-kernel/crates/codegen/xai-grok-sandbox", default-features = false }
xai-grok-config-types = { path = "../agent-kernel/crates/codegen/xai-grok-config-types" }

[dev-dependencies]
http-body-util = "0.1"
